name: Clang Quality Audit

# squared's own build and checks, as its README gives them: the framework is
# under packages/package.squared-core/tree/squared/ and builds with make (no
# CMake). It needs clang and libc++ of the major version third_party/libcxx
# is pinned to (21: `import std` is built from those sources, and the build
# refuses other libc++ headers), so the toolchain comes from apt.llvm.org;
# Ubuntu 24.04's own clang is 18.
#
#   build and test   must pass
#   lint             tools/lint.sh (format, source rules, clang-tidy): reported,
#                    with its report kept as an artifact; findings do not fail
#                    the run (as before: the audit is advisory)

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  LLVM: 21
  SQUARED: packages/package.squared-core/tree/squared

jobs:
  clang-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out project
        uses: actions/checkout@v5

      - name: clang, libc++, clang-format and clang-tidy ${{ env.LLVM }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-$LLVM main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update -q
          sudo apt-get install --yes --no-install-recommends make \
            clang-$LLVM clang-format-$LLVM clang-tidy-$LLVM lld-$LLVM \
            libc++-$LLVM-dev libc++abi-$LLVM-dev
          # Unversioned names (clang++, clang-format, clang-tidy) are what the
          # build and tools/lint.sh call.
          echo "/usr/lib/llvm-$LLVM/bin" >> "$GITHUB_PATH"

      - name: Third-party sources
        working-directory: ${{ env.SQUARED }}
        shell: bash
        run: |
          clang++ --version | head -n 1
          ./tools/vendor_third_party.sh

      - name: Build and test
        working-directory: ${{ env.SQUARED }}
        shell: bash
        run: |
          set -euo pipefail
          make -j4 CXX=clang++
          make test CXX=clang++

      - name: Lint (format, source rules, clang-tidy)
        id: lint
        continue-on-error: true
        working-directory: ${{ env.SQUARED }}
        shell: bash
        run: ./tools/lint.sh --jobs 4

      - name: Where the findings are
        if: always()
        working-directory: ${{ env.SQUARED }}
        shell: bash
        run: |
          # Which files the findings point at (clang-tidy's own output), and
          # in which check: a header every unit includes shows up once per
          # unit.
          out=build/release/lint/tidy
          [ -d "$out" ] || { echo "no clang-tidy output"; exit 0; }
          grep -rhoE '^[^ :]+:[0-9]+:[0-9]+: (warning|error): .*\[[a-z-]+[a-z.-]*\]$' "$out" |
            sed -E 's/^([^:]+):([0-9]+):[0-9]+: [a-z]+: .*\[([^]]+)\]$/\1:\2 \3/' |
            sort | uniq -c | sort -rn | head -40

      - name: Lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: ${{ env.SQUARED }}/build/release/lint/
          if-no-files-found: ignore
