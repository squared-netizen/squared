name: Clang Quality Gate

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clang-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out project
        uses: actions/checkout@v5

      - name: Install Clang workflow tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes clang clang-format clang-tidy clang-tools fish fd-find ninja-build
          sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd

      - name: Configure compilation database
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build and test
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure

      - name: Run full Clang quality gate
        shell: bash
        run: fish tools/clang-check.fish --full
